# ============================================================
# Render Blueprint — agent (Docker) + Redis (Key Value)
# Render → New → Blueprint → chọn repo; rootDir trỏ vào 06-lab-complete.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ cho phép kết nối nội bộ
    maxmemoryPolicy: noeviction
