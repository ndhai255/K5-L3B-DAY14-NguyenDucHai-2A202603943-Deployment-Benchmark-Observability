# ============================================================
# Railway — build bằng Dockerfile, healthcheck /health.
# Railway cấp biến PORT; CMD trong Dockerfile lắng nghe ${PORT:-8000}.
# Biến cần đặt trên dashboard / CLI (không ghi ở đây):
#   AGENT_API_KEY, REDIS_URL (tham chiếu service Redis: ${{Redis.REDIS_URL}}),
#   ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, MONTHLY_BUDGET_USD
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
