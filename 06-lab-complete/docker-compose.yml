# ============================================================
# Agent + Redis — chạy bằng một lệnh: docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"     # cổng 8000 bận thì: HOST_PORT=8010 docker compose up
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    # AGENT_API_KEY, RATE_LIMIT_PER_MINUTE, *_BUDGET_USD... đọc từ .env (xem .env.example)
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
